<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TennisOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23DFFF4F'/%3E%3Cpath d='M12 10a30 30 0 0 1 0 44M52 10a30 30 0 0 0 0 44' stroke='white' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <span class="word">TennisOS</span>
    <nav class="tabs" aria-label="Screens">
      <button data-tab="coach" aria-current="page">Coach</button>
      <button data-tab="matches">Matches<i class="dot" hidden></i></button>
      <button data-tab="notes">Notes<i class="dot" hidden></i></button>
      <button data-tab="focus">Focus<i class="dot" hidden></i></button>
    </nav>
    <button class="icon-btn" id="menuBtn" aria-label="Backup and settings">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>

  <!-- COACH -->
  <main class="screen coach" id="coach" data-screen="coach">
    <section class="stage">
      <p class="status" id="status" aria-live="polite">Tap the ball to talk</p>
      <div class="ball-wrap">
        <button class="ball-btn" id="ballBtn" aria-label="Start talking to your coach">
          <canvas id="orb"></canvas>
        </button>
      </div>
      <div class="lines" id="lines" aria-live="polite">
        <p class="coach-line" id="coachLine">Tell me about your last match, or what you worked on in practice.</p>
        <p class="you-line" id="youLine"></p>
      </div>
      <ul class="saved" id="saved" aria-label="Saved during this conversation"></ul>
      <div class="controls">
        <button class="round" id="typeBtn" aria-label="Type instead">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
        </button>
        <button class="main-btn" id="mainBtn">Start talking</button>
        <button class="round" id="muteBtn" aria-label="Mute microphone" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/><path class="slash" d="M4 4l16 16"/></svg>
        </button>
      </div>
      <form class="composer" id="composer" hidden>
        <textarea id="composerInput" rows="1" placeholder="Message your coach" aria-label="Message your coach"></textarea>
        <button type="submit" class="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </form>
    </section>
    <aside class="now-panel" id="nowPanel" aria-label="What you're working on"></aside>
  </main>

  <!-- MATCHES -->
  <main class="screen list-screen" id="matches" data-screen="matches" hidden>
    <div class="screen-head">
      <h1>Matches</h1>
      <div class="record" id="record"></div>
      <button class="add" data-add="match">Add match</button>
    </div>
    <ol class="match-list" id="matchList"></ol>
  </main>

  <!-- NOTES -->
  <main class="screen list-screen" id="notes" data-screen="notes" hidden>
    <div class="screen-head">
      <h1>Notes</h1>
      <div class="filters" id="noteFilters" role="group" aria-label="Filter notes"></div>
      <button class="add" data-add="note">Add note</button>
    </div>
    <div id="noteList"></div>
  </main>

  <!-- FOCUS -->
  <main class="screen list-screen" id="focus" data-screen="focus" hidden>
    <div class="screen-head">
      <h1>Focus</h1>
      <button class="add" data-add="focus">Add area</button>
    </div>
    <section class="profile" id="profile"></section>
    <div id="focusList"></div>
  </main>
</div>

<dialog id="sheet"><form method="dialog" id="sheetForm"></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
